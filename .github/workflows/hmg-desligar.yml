name: Desligar HMG

# Manual: publica uma página "homologação desligada" no repositório Tabela_Raoni_HMG.
# Para religar, faça qualquer push em `hmg` ou rode a action "Deploy HMG".
on:
  workflow_dispatch:

permissions:
  contents: read       # o push para o repo HMG usa a deploy key, não o GITHUB_TOKEN

concurrency:
  group: deploy-hmg    # mesmo grupo do Deploy HMG: nunca dois deploys ao mesmo tempo no repo HMG
  cancel-in-progress: true

jobs:
  desligar:
    runs-on: ubuntu-latest
    environment:
      name: hmg
      url: https://pedrodiogenesfilho.github.io/Tabela_Raoni_HMG/
    steps:
      - name: Gerar página de homologação desligada
        run: |
          mkdir -p dist
          touch dist/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          printf 'desligado %s por %s\n' "$(date -u +'%Y-%m-%d %H:%M UTC')" "$GITHUB_ACTOR" > dist/hmg-version.txt
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <meta name="robots" content="noindex, nofollow" />
            <title>Homologação desligada</title>
            <style>
              body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #F3F5F7; color: #1C2430; }
              main { max-width: 36rem; margin: 1rem; padding: 2rem; background: #fff; border-radius: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
              h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
              a { color: #0B6E4F; }
            </style>
          </head>
          <body>
            <main>
              <h1>Ambiente de homologação desligado</h1>
              <p>Este endereço só fica ativo durante testes. O site oficial é <a href="https://tabelaraoni.com.br/">tabelaraoni.com.br</a>.</p>
            </main>
          </body>
          </html>
          EOF
          cp dist/index.html dist/404.html

      - name: Publicar no repositório Tabela_Raoni_HMG
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          deploy_key: ${{ secrets.HMG_DEPLOY_KEY }}
          external_repository: PedroDiogenesFilho/Tabela_Raoni_HMG
          publish_branch: main
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "HMG desligado por ${{ github.actor }}"
